[package]
name = "gif-overlay"
version = "1.3.5"
edition = "2021"
description = "Minimalist GIF & Image Viewer"
authors = ["DuyXYZ"]

[[bin]]
name = "GIF-Overlay"
path = "src/main.rs"

[dependencies]
gif = { version = "0.13", default-features = false, features = ["std"] }
image-webp = { version = "0.2.4", default-features = false }
png = { version = "0.18.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Com_Urlmon", "Win32_System_Variant","Win32_Foundation"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
