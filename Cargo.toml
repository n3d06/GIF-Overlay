[package]
name = "gif-overlay"
version = "1.3.5"
edition = "2021"
description = "Minimalist GIF & Image Viewer"
authors = ["DuyXYZ"]

[[bin]]
name = "GIF-Overlay"
path = "src/main.rs"

[dependencies]
gif = { version = "0.13", default-features = false, features = ["std"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
