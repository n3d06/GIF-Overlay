name: CI/CD Pipeline

on:
  pull_request:
    paths-ignore: ['web/**', '**/*.md', 'LICENSE']
  # Run manually on main to cut a release: tag -> build -> installer -> GitHub Release
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes in Markdown, shown above the generated changelog'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # 1. Make sure it builds (every PR / manual run)
  build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked --workspace

  # 2. Create the next tag (manual run on main only, after the build passed)
  create-tag:
    needs: build-check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tagging.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Determine bump type
        id: bump_type
        shell: bash
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          patch=$(echo "$latest_tag" | cut -d. -f3)
          if [ "$patch" -eq 9 ]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump version and push tag
        id: tagging
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: ${{ steps.bump_type.outputs.type }}

  # 3. Build the release artifacts and publish the GitHub Release
  create-release:
    needs: create-tag
    runs-on: windows-latest
    if: needs.create-tag.outputs.new_tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Stamp version
        shell: bash
        run: |
          tag="${{ needs.create-tag.outputs.new_tag }}"
          ver="${tag#v}"
          # first match is the [package] version
          sed -i "0,/^version = \".*\"/s//version = \"$ver\"/" Cargo.toml codec/Cargo.toml
          sed -i "s/^#define MyAppVersion \".*\"/#define MyAppVersion \"$ver\"/" setup_script.iss
          grep -m1 '^version' Cargo.toml
          grep -m1 'MyAppVersion' setup_script.iss

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/GIF-Overlay | Out-Null
          Copy-Item target/release/GIF-Overlay.exe dist/GIF-Overlay/
          Copy-Item target/release/gifoverlay_codec.dll dist/GIF-Overlay/
          Compress-Archive -Path dist/GIF-Overlay/* -DestinationPath dist/GIF-Overlay-Portable.zip -Force

      - name: Compile setup (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: setup_script.iss

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/GIF-Overlay-Portable.zip, dist/GIF-Overlay-Setup-x64.exe, dist/GIF-Overlay/GIF-Overlay.exe, dist/GIF-Overlay/gifoverlay_codec.dll -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.new_tag }}
          name: Release ${{ needs.create-tag.outputs.new_tag }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: true
          files: |
            dist/GIF-Overlay-Portable.zip
            dist/GIF-Overlay-Setup-x64.exe
            dist/SHA256SUMS.txt
