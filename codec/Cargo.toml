[package]
name = "gifoverlay-codec"
version = "1.3.5"
edition = "2021"
description = "Image decoders of GIF Overlay (GIF, APNG, animated WebP, WIC), loaded by the exe at runtime"
authors = ["DuyXYZ"]

[lib]
name = "gifoverlay_codec"
crate-type = ["cdylib", "rlib"]

[dependencies]
gif = { version = "0.13", default-features = false, features = ["std"] }
image-webp = { version = "0.2.4", default-features = false }
png = { version = "0.18.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }
